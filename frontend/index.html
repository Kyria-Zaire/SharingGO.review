<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <title>Sharing Go — Navette</title>
    <style>
      html,
      body {
        margin: 0;
        background: #000000;
        color: #ffffff;
      }

      #root {
        min-height: 100vh;
        min-height: 100dvh;
      }

      #app-splash {
        box-sizing: border-box;
        display: flex;
        min-height: 100vh;
        min-height: 100dvh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 1.5rem;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        text-align: center;
      }

      #app-splash .brand {
        color: #22c55e;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      #app-splash .subtitle {
        color: #ffffff;
        font-size: 0.875rem;
        font-weight: 500;
      }

      #app-splash .message {
        color: #a3a3a3;
        font-size: 0.875rem;
        max-width: 18rem;
      }

      #app-splash .spinner {
        width: 2.5rem;
        height: 2.5rem;
        border: 2px solid #262626;
        border-top-color: #22c55e;
        border-radius: 9999px;
        animation: app-splash-spin 0.8s linear infinite;
      }

      @keyframes app-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-splash" aria-live="polite" aria-busy="true">
        <p class="brand">SharingGO</p>
        <p class="subtitle">Admin cockpit</p>
        <div class="spinner" aria-hidden="true"></div>
        <p class="message">Chargement de la session…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
