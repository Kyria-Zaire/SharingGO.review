name: Deploy Production

on:
  push:
    tags:
      - "v*.*.*"

# Un déploiement production ne doit JAMAIS être interrompu à mi-chemin.
# cancel-in-progress: false est non-négociable — ne pas modifier.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  # ────────────────────────────────────────────────────────────
  # GATE — lint + build de tous les artefacts avant tout SSH
  # Un échec ici arrête le workflow avant tout contact avec le VPS.
  # ────────────────────────────────────────────────────────────
  gate-backend:
    name: Gate — Backend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (tsc)
        run: npm run build

  gate-passenger:
    name: Gate — Passenger lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/apps/passenger

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2  # v4.0.0
        with:
          version: "9"
          run_install: false

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: pnpm-passenger-${{ hashFiles('frontend/apps/passenger/pnpm-lock.yaml') }}
          restore-keys: pnpm-passenger-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
        env:
          VITE_API_URL: https://api.sharinggo.fr
          VITE_GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
          ROBOTS_POLICY: allow
          PUBLIC_SITE_URL: https://sharinggo.fr

      - name: Audit internal links
        run: pnpm audit:links

  gate-admin:
    name: Gate — Admin lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # ────────────────────────────────────────────────────────────
  # DEPLOY — SSH VPS, séquence bloquante étape par étape
  # Aucun secret applicatif ici : Stripe, Sentry, DB vivent dans .env.prod sur le VPS.
  # ────────────────────────────────────────────────────────────
  deploy:
    name: Deploy — ${{ github.ref_name }}
    runs-on: ubuntu-latest
    needs: [gate-backend, gate-passenger, gate-admin]
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262  # v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          # script_stop: true — si une commande retourne exit != 0, le script s'arrête immédiatement.
          # Pas de rollback automatique — en cas d'échec, le workflow échoue proprement
          # et l'opérateur suit la procédure de rollback manuel (DEPLOY-01-G-cicd.md).
          script: |
            set -euo pipefail
            TAG="${{ github.ref_name }}"

            echo "=== [1/7] Vérification état repo avant modification ==="
            # Exclure .env.prod (fichier local légitime, jamais versionné).
            # Exclure backups/ explicitement dans le pathspec — NE PAS dépendre du
            # .gitignore du tag déployé (un rollback vers un vieux tag pourrait faire
            # reculer ce .gitignore et réintroduire backups/ dans le dirty check).
            # Si des fichiers versionnés sont modifiés localement → arrêt immédiat.
            DIRTY=$(git -C /opt/sharinggo status --short -- ':!.env.prod' ':!backups/')
            if [ -n "$DIRTY" ]; then
              echo "ERREUR : fichiers versionnés modifiés localement sur le VPS."
              echo "$DIRTY"
              echo ""
              echo "Corriger avant de déployer :"
              echo "  git -C /opt/sharinggo checkout -- <fichier>  # annuler une modification involontaire"
              echo "  git -C /opt/sharinggo stash                  # conserver pour plus tard"
              echo "Voir docs/ops/DEPLOY-01-G-cicd.md §4 pour la procédure complète."
              exit 1
            fi
            echo "✔ Repo propre"

            echo "=== [2/7] Checkout du tag ${TAG} ==="
            cd /opt/sharinggo
            git fetch --tags
            git checkout "${TAG}"
            echo "✔ Tag ${TAG} checké"

            echo "=== [3/7] Backup obligatoire pré-déploiement ==="
            chmod +x scripts/backup-postgres.sh scripts/check-backup.sh || true
            ./scripts/backup-postgres.sh
            LATEST_BACKUP=$(ls -t /opt/sharinggo/backups/sharinggo_*.sql.gz 2>/dev/null | head -1)
            if [ -z "${LATEST_BACKUP}" ]; then
              echo "ERREUR : aucun fichier backup trouvé après backup-postgres.sh."
              exit 1
            fi
            echo "Backup : ${LATEST_BACKUP}"

            echo "=== [4/7] Vérification intégrité du backup ==="
            ./scripts/check-backup.sh "${LATEST_BACKUP}"
            echo "✔ Backup valide"

            echo "=== [5/7] Déploiement Docker Compose ==="
            # SENTRY_RELEASE injecté ici uniquement — ne modifie pas .env.prod.
            # Le service migrator (depends_on postgres: healthy) exécute
            # prisma migrate deploy avant que le backend ne démarre.
            # Si la migration échoue → backend ne démarre pas → /ready échoue → étape 7 échoue.
            SENTRY_RELEASE="${TAG}" docker compose \
              -f docker-compose.prod.yml \
              --env-file .env.prod \
              up -d --build
            echo "✔ docker compose up lancé"

            echo "=== [6/7] État des containers ==="
            docker compose -f docker-compose.prod.yml --env-file .env.prod ps

            echo "=== [6b/7] Attente démarrage (30s) ==="
            sleep 30

            echo "=== [7/7] Healthchecks ==="
            curl --fail --silent --show-error \
              --retry 3 --retry-delay 10 --retry-connrefused \
              https://api.sharinggo.fr/health
            echo ""
            curl --fail --silent --show-error \
              --retry 3 --retry-delay 10 --retry-connrefused \
              https://api.sharinggo.fr/ready
            echo ""
            echo "✔ Healthchecks OK — déploiement ${TAG} réussi"

  # ────────────────────────────────────────────────────────────
  # NOTIFY — résumé dans GitHub Actions (s'exécute toujours)
  # ────────────────────────────────────────────────────────────
  notify:
    name: Notify — deployment summary
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()

    steps:
      - name: Write deployment summary
        run: |
          TAG="${{ github.ref_name }}"
          DEPLOY_STATUS="${{ needs.deploy.result }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "${DEPLOY_STATUS}" = "success" ]; then
            STATUS_ICON="✅"
            STATUS_TEXT="SUCCESS"
          else
            STATUS_ICON="❌"
            STATUS_TEXT="FAILED"
          fi

          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## ${STATUS_ICON} Déploiement ${TAG} — ${STATUS_TEXT}

          | Champ | Valeur |
          |-------|--------|
          | Tag | \`${TAG}\` |
          | Statut | **${STATUS_TEXT}** |
          | Déclenché par | @${{ github.actor }} |
          | Commit | \`${{ github.sha }}\` |
          | Logs | [Voir les logs](${{ env.RUN_URL }}) |

          $(if [ "${DEPLOY_STATUS}" != "success" ]; then
            echo "### ⚠️ Échec du déploiement"
            echo ""
            echo "Consulter **[docs/ops/DEPLOY-01-G-cicd.md](../../docs/ops/DEPLOY-01-G-cicd.md)** pour :"
            echo "- Procédure de rollback manuel"
            echo "- Gestion repo sale sur VPS"
            echo "- Diagnostic healthcheck post-deploy"
          fi)
          EOF
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
